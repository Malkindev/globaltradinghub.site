    <!-- Clear any previously installed caching service worker before boot. -->

    (function () {
        if (!('serviceWorker' in navigator)) return;
        var key = 'gth_sw_cleanup_v1';
        if (sessionStorage.getItem(key)) return;
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
            if (!registrations.length) return;
            sessionStorage.setItem(key, '1');
            return Promise.all(registrations.map(function (r) { return r.unregister(); }))
                .then(function () { window.location.reload(); });
        }).catch(function () {});
    })();
    </script>

        /* ── Autotrades-style brand tokens ── */

            --hlx-blue-lo: #0b1f3a;

            --dynamic-tab-pills-container-bg: #ffffff !important;
            --dynamic-tab-pills-container-border: #e2e8f0 !important;
            --dynamic-tab-pills-bg: #ffffff !important;
            --dynamic-tab-pills-hover-bg: #f1f5f9 !important;

            --general-section-1: #ffffff !important;

        /* ── Autotrades / Light Theme Token Overrides ── */

            --button-primary-hover: #1e3a8a;
            --du-brand-red-coral: #ff444f;

            --du-color-blue-6: #0f2a5a;

        /* ── Header Styling (Clean Autotrades Header) ── */
        .app-header, .app-header--desktop {
            background: #ffffff !important;
            border-bottom: 1px solid #e2e8f0 !important;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04) !important;
            height: 48px !important;

        .logo-holder img[src^="data:"] { display: none !important; }
        .logo-holder img:not([src^="data:"]) {
            height: 34px !important; width: auto !important;
            filter: drop-shadow(0 1px 3px rgba(15,42,90,.15));
            transition: transform .3s cubic-bezier(.16,1,.3,1), filter .3s;
        }
        .d-apollo-logo:hover .logo-holder img:not([src^="data:"]) {
            transform: translateY(-1px) scale(1.03);
        }
        .logo-holder { display: flex !important; align-items: center; gap: 10px; }

            content: "%%APP_NAME%%";
            font-family: %%FONT_FAMILY%%, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: .01em;
            line-height: 1;
            color: #0f2a5a;
            white-space: nowrap;
        }
        .app-header__account-settings {
            border-inline-end: 1px solid #e2e8f0 !important;
        }

            font-size: 1.3rem !important;
            height: 32px !important;
            line-height: 30px !important;
            padding: 0 16px !important;

        .auth-actions button:not(.dc-btn--primary):hover {
            background: #f8fafc !important;
            border-color: #94a3b8 !important;
        }
        .auth-actions .dc-btn--primary,
        .auth-actions button.dc-btn--primary {
            background: #0f2a5a !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 6px !important;
            font-weight: 600 !important;
            font-size: 1.3rem !important;
            height: 32px !important;
            line-height: 32px !important;

            background: #1e3a8a !important;
        }

            font-size: 1.3rem !important;
            padding: 0.6rem 2rem !important;
            box-shadow: 0 1px 3px rgba(16, 185, 129, 0.3) !important;

        .btn--run:hover,
        .db-run-panel__button--run:hover,
        button.dc-btn--green:hover {

        }

        /* ── Loaders & Spinners (Navy) ── */
        .barspinner .rect, .dc-loading .rect, .initial-loader .rect,
        [class*="barspinner"] [class*="rect"] { background-color: #0f2a5a !important; }

        .dc-loading, [class*="loading__"] path[fill]:not([fill="none"]) { color: #0f2a5a !important; }

        .bot-card:hover, [class*="bot-list__card"]:hover {
