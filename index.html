<!doctype html>
<html lang="en" dir="auto" class="theme--light">
<head>
    <!-- HYPRLVX domain lock — halts app init on any host other than the real
         site, so a copy-pasted clone shows a message instead of the trading UI.
         Not a security boundary (trivially stripped) — the real backstop is that
         Deriv only allows OAuth redirects to the registered hyprlvx.xyz URLs. -->
    <script>
    (function () {
        var ALLOWED = %%ALLOWED_DOMAINS_JSON%%.concat(['localhost', '127.0.0.1']);
        var host = window.location.hostname;
        if (ALLOWED.indexOf(host) !== -1) return;
        document.documentElement.innerHTML =
            '<head><meta charset="UTF-8"><title>%%APP_NAME%%</title></head>' +
            '<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'background:%%BACKGROUND_COLOR%%;color:#e5e7eb;font-family:sans-serif;text-align:center;padding:24px;">' +
            '<div><h1 style="color:%%ACCENT_COLOR%%;">%%APP_NAME%%</h1>' +
            '<p>This application only runs at <a href="https://%%PRIMARY_DOMAIN%%/" style="color:%%PRIMARY_COLOR%%;">%%PRIMARY_DOMAIN%%</a>.</p></div>' +
            '</body>';
        try { window.stop(); } catch (e) {}
        throw new Error('%%APP_NAME%%: blocked on unauthorized host ' + host);
    })();
    </script>

    <!-- Clear any previously installed caching service worker before boot. -->
    <script>
    (function () {
        if (!('serviceWorker' in navigator)) return;
        var key = 'gth_sw_cleanup_v1';
        if (sessionStorage.getItem(key)) return;
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
            if (!registrations.length) return;
            sessionStorage.setItem(key, '1');
            return Promise.all(registrations.map(function (r) { return r.unregister(); }))
                .then(function () { window.location.reload(); });
        }).catch(function () {});
    })();
    </script>

    <!-- Google Tag Manager -->

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link id="dynamic-favicon" rel="icon" type="image/png" href="/assets/media/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="title" content="%%APP_NAME%% — %%TAGLINE%%" />
    <meta name="description" content="%%DESCRIPTION%%" />
    <meta name="theme-color" content="%%PRIMARY_COLOR%%" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%%APP_NAME%%" />
    <meta property="og:url" content="https://%%PRIMARY_DOMAIN%%/" />
    <meta property="og:title" content="%%APP_NAME%% — %%TAGLINE%%" />
    <meta property="og:description" content="%%DESCRIPTION%%" />
    <meta property="og:image" content="https://%%PRIMARY_DOMAIN%%/assets/media/og-banner.png" />
    <meta property="og:image:secure_url" content="https://%%PRIMARY_DOMAIN%%/assets/media/og-banner.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta property="og:image:alt" content="%%APP_NAME%% — %%TAGLINE%%" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%APP_NAME%% — %%TAGLINE%%" />
    <meta name="twitter:description" content="%%DESCRIPTION%%" />
    <meta name="twitter:image" content="https://%%PRIMARY_DOMAIN%%/assets/media/og-banner.png" />
    <title>%%APP_NAME%% — %%TAGLINE%%</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Font family is configurable — see FONT_GOOGLE_PARAM in brand.config.js -->
    <link href="https://fonts.googleapis.com/css2?family=%%FONT_GOOGLE_PARAM%%&display=swap" rel="stylesheet">
    <style>
        /* Deriv app CSS is sized for a 10px root — required. */
        :root { font-size: 62.5%; }

        /* ── HYPRLVX brand tokens ── */
        :root {
            --hlx-purple: %%PRIMARY_COLOR%%;
            --hlx-purple-hi: %%ACCENT_COLOR%%;
            --hlx-purple-lo: %%PRIMARY_COLOR_DARK%%;
            --hlx-glow: #8b5cf6;
            --hlx-bg: %%BACKGROUND_COLOR%%;
            --hlx-ink: #e9e4f5;
        }

        html, body {
            margin: 0; padding: 0;
            background: var(--hlx-bg);
            color: var(--hlx-ink);
            font-family: %%FONT_FAMILY%%, system-ui, sans-serif;
        }

        /* ── HYPRLVX THEME OVERRIDES ──────────────────────────────────────────
           The build themes from /api/appwrite/site-settings (primaryColor / …).
           These variable overrides re-skin the remaining Deriv design tokens the
           settings JSON doesn't reach — the HYPRLVX purple/black palette. Loss /
           danger stays red because red carries meaning (a loss), not brand. */
        :root, .theme--dark, .theme--light, body {
            --button-primary-default: %%PRIMARY_COLOR%%;
            --button-primary-hover: %%PRIMARY_COLOR_DARK%%;
            --du-brand-red-coral: %%PRIMARY_COLOR%%;
            --du-button-primary-default: %%PRIMARY_COLOR%%;
            --du-button-primary-hover: %%PRIMARY_COLOR_DARK%%;
            --du-button-primary-light-default: #723ec322;
            --du-button-primary-light-hover: #723ec33a;
            --du-button-tertiary-hover: #723ec31c;
            --du-text-red: %%ACCENT_COLOR%%;
            --du-purchase-main-2: %%PRIMARY_COLOR%%;
            --du-purchase-section-2: %%PRIMARY_COLOR_DARK%%;
            /* danger / loss keep a true red (semantic, not brand) */
            --du-status-danger: #ef4444;
            --du-transparent-danger: #ef444422;
            /* Retint every Deriv blue to the HYPRLVX purple family */
            --du-color-blue-1: %%PRIMARY_COLOR%%;
            --du-color-blue-2: #8b5cf6;
            --du-color-blue-3: #7c3aed;
            --du-color-blue-4: #6d28d9;
            --du-color-blue-5: #5b21b6;
            --du-color-blue-6: #4c1d95;
            --du-text-blue: %%ACCENT_COLOR%%;
            --du-text-info: %%ACCENT_COLOR%%;
            --du-status-info: %%PRIMARY_COLOR%%;
            --du-transparent-info: #723ec322;
            --du-button-info-default: %%PRIMARY_COLOR%%;
            --du-button-info-hover: #8b5cf6;
            --core-color-solid-blue-1: %%PRIMARY_COLOR%%;
            --core-color-solid-blue-2: #8b5cf6;
            color-scheme: dark;
        }

        /* ── SINGLE BRAND LOCKUP ──────────────────────────────────────────────
           Restyle the build's native header logo (React-owned, so pure CSS — no
           JS injection to get reconciled away): cropped owl mark (logoUrl) +
           a "HYPRLVX" wordmark, with the "powered by deriv" sub-mark removed. */
        /* Hide the generated "powered by deriv" wordmark (a data: SVG). */
        .logo-holder img[src^="data:"] { display: none !important; }
        /* The owl mark (uploaded logoUrl) — size + glow. */
        .logo-holder img:not([src^="data:"]) {
            height: 42px !important; width: auto !important;
            filter: drop-shadow(0 0 8px rgba(114,62,195,.6));
            transition: transform .3s cubic-bezier(.16,1,.3,1), filter .3s;
        }
        .d-apollo-logo:hover .logo-holder img:not([src^="data:"]) {
            transform: translateY(-1px) scale(1.05);
            filter: drop-shadow(0 0 15px rgba(157,110,240,.95));
        }
        .logo-holder { display: flex !important; align-items: center; gap: 10px; }
        .logo-holder::after {
            content: "%%APP_NAME%%";
            font-family: %%FONT_FAMILY%%, sans-serif; font-size: 2.6rem; letter-spacing: .03em; line-height: 1;
            color: %%ACCENT_COLOR%%; white-space: nowrap;
            text-shadow: 0 0 10px rgba(114,62,195,.7), 0 0 22px rgba(139,92,246,.4);
        }

        /* ── LOADERS / SPINNERS → purple (D-Trader, charts, page loaders) ── */
        .barspinner .rect, .dc-loading .rect, .initial-loader .rect,
        [class*="barspinner"] [class*="rect"] { background-color: %%ACCENT_COLOR%% !important; }
        [class*="loader"] svg circle[stroke]:not([stroke="none"]),
        [class*="spinner"] svg circle[stroke]:not([stroke="none"]) { stroke: %%ACCENT_COLOR%% !important; }
        .dc-loading, [class*="loading__"] path[fill]:not([fill="none"]) { color: %%ACCENT_COLOR%% !important; }

        /* Analysis embed (api.binarytool.site) is cross-origin — its blue
           "Analysistool" title can't be selected directly, so shift the embed's
           hue toward the HYPRLVX purple. */
        .iframe-switcher iframe, iframe[src*="binarytool"] { filter: hue-rotate(48deg) saturate(1.05); }

        /* Tradingview / Trading-grid toggle buttons → theme purple (were hard blue) */
        [class*="chart"] button[class*="active"], .smartcharts button.active { background: %%PRIMARY_COLOR%% !important; }

        /* ── LIFE: shimmer, glow, hover, reflection ───────────────────────────
           Purposeful motion (the site should feel alive). Everything degrades to
           a static state under prefers-reduced-motion. */

        /* smooth base transitions on interactive chrome */
        .dc-btn, .auth-actions button, [role="tab"], .dc-tabs__item,
        .bot-card, [class*="bot-list__card"], [class*="quick-strategy"] [class*="card"] {
            transition: transform .28s cubic-bezier(.16,1,.3,1),
                        box-shadow .28s cubic-bezier(.16,1,.3,1),
                        filter .28s cubic-bezier(.16,1,.3,1) !important;
        }

        /* primary buttons: lift + purple glow + a light sheen that sweeps across */
        .dc-btn--primary, .auth-actions__primary, button[class*="--primary"] {
            position: relative; overflow: hidden;
        }
        .dc-btn--primary::after, .auth-actions__primary::after,
        button[class*="--primary"]::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
            transform: translateX(-120%); pointer-events: none;
        }
        .dc-btn--primary:hover, .auth-actions__primary:hover,
        button[class*="--primary"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(114,62,195,.45), 0 0 0 1px rgba(157,110,240,.35) inset;
        }
        .dc-btn--primary:hover::after, .auth-actions__primary:hover::after,
        button[class*="--primary"]:hover::after {
            animation: hlx-sheen .8s cubic-bezier(.16,1,.3,1);
        }
        @keyframes hlx-sheen { to { transform: translateX(120%); } }

        /* cards: lift + glow + a faint top reflection */
        .bot-card:hover, [class*="bot-list__card"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(114,62,195,.28), 0 0 0 1px rgba(157,110,240,.25);
        }

        /* tabs: active/hover glow */
        [role="tab"]:hover, .dc-tabs__item:hover { filter: drop-shadow(0 0 6px rgba(139,92,246,.5)); }

        /* animated purple aura behind the header for depth */
        @keyframes hlx-aura { 0%,100%{opacity:.5} 50%{opacity:.9} }

        @media (prefers-reduced-motion: reduce) {
            *, ::after, ::before { animation: none !important; transition: none !important; }
        }

    </style>

    <!-- HYPRLVX overlays — must run before the bundle opens sockets / patches fetch -->
    <script defer src="/static/js/hlx-ws.js?v=20260924-5"></script>
    <script defer src="/static/js/hlx-bots.js"></script>

    <!-- App build (deferred, executes in order) -->
    <script defer src="/static/js/lib-react.7e3f0832.js"></script>
    <script defer src="/static/js/lib-router.13959373.js"></script>
    <script defer src="/static/js/160.abd80728.js"></script>
    <script defer src="/static/js/index.2511c10a.js"></script>
    <link href="/static/css/160.96116a77.css" rel="stylesheet">
    <link href="/static/css/index.9ed654a3.css" rel="stylesheet">

    <!-- HYPRLVX UI overlay (branding, WhatsApp, theme fixes; runs after render) -->
    <script defer src="/static/js/hlx-ui.js"></script>
</head>

<body class="body theme theme--light">
    <div id="modal_root" class="modal-root"></div>
    <div id="popup_root" class="popup-root"></div>
    <div id="root"></div>

</body>
</html>
